name: CI

on:
  push:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check/eslint
        run: npm run typecheck && npm run lint

      - name: Build app
        run: npm run build
